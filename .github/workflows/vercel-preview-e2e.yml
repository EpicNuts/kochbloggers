name: Vercel Preview E2E

on:
  deployment_status: {}
  workflow_dispatch: {}

jobs:
  e2e-preview:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment_url != '' &&
      contains(github.event.deployment.environment, 'Preview'))
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout deployment commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Show target preview URL
        env:
          PREVIEW_URL: ${{ github.event.deployment_status.environment_url }}
          FALLBACK_URL: ${{ vars.PLAYWRIGHT_BASE_URL }}
        run: |
          TARGET_URL="${PREVIEW_URL:-$FALLBACK_URL}"
          echo "Testing preview URL: ${TARGET_URL}"

      - name: Verify preview is reachable
        env:
          PREVIEW_URL: ${{ github.event.deployment_status.environment_url }}
          FALLBACK_URL: ${{ vars.PLAYWRIGHT_BASE_URL }}
        run: |
          set -euo pipefail

          TARGET_URL="${PREVIEW_URL:-$FALLBACK_URL}"

          echo "Checking preview access at: ${TARGET_URL}"
          http_code=$(curl -sSL -o preview.html -w '%{http_code}' --max-redirs 5 "${TARGET_URL}")

          if [[ "${http_code}" != "200" ]]; then
            echo "Preview returned HTTP ${http_code}."
            echo "Common causes: Vercel deployment protection, an auth wall, or the deployment is not ready yet."
            echo "Response body preview:"
            sed -n '1,120p' preview.html || true
            exit 1
          fi

          if grep -Eqi 'vercel.*protect|deployment.*protect|access denied|sign in|security checkpoint' preview.html; then
            echo "Preview appears to be protected by Vercel or an auth wall."
            echo "Response body preview:"
            sed -n '1,160p' preview.html || true
            exit 1
          fi

      - name: Run E2E tests against Vercel Preview
        env:
          PREVIEW_URL: ${{ github.event.deployment_status.environment_url }}
          FALLBACK_URL: ${{ vars.PLAYWRIGHT_BASE_URL }}
        run: |
          PLAYWRIGHT_BASE_URL="${PREVIEW_URL:-$FALLBACK_URL}" npm run test:e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
