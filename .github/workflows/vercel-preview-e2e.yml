name: Vercel Preview E2E

on:
  deployment_status: {}
  workflow_dispatch: {}

jobs:
  e2e-preview:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment_url != '' &&
      contains(github.event.deployment.environment, 'Preview'))
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout deployment commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Show target preview URL
        env:
          PREVIEW_URL: ${{ github.event.deployment_status.environment_url }}
          FALLBACK_URL: ${{ vars.PLAYWRIGHT_BASE_URL }}
        run: |
          TARGET_URL="${PREVIEW_URL:-$FALLBACK_URL}"
          echo "Testing preview URL: ${TARGET_URL}"
          echo "PREVIEW_TEST_URL=${TARGET_URL}" >> $GITHUB_ENV

      - name: Verify preview is reachable
        env:
          BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail

          TARGET_URL="${PREVIEW_TEST_URL}"
          MAX_HOPS=8

          if [[ -z "${BYPASS_SECRET}" ]]; then
            echo "Missing GitHub secret VERCEL_AUTOMATION_BYPASS_SECRET."
            exit 1
          fi

          echo "Checking preview access at: ${TARGET_URL}"

          for ((hop=1; hop<=MAX_HOPS; hop++)); do
            http_code=$(curl -sS -o preview.html -D preview_headers.txt -w '%{http_code}' \
              -H "x-vercel-protection-bypass: ${BYPASS_SECRET}" \
              -H "x-vercel-set-bypass-cookie: true" \
              "${TARGET_URL}")

            if [[ "${http_code}" == "200" ]]; then
              if grep -Eqi 'vercel.*protect|deployment.*protect|access denied|sign in|security checkpoint' preview.html; then
                echo "Preview appears to be protected by Vercel or an auth wall (HTTP 200 protection page)."
                sed -n '1,160p' preview.html || true
                exit 1
              fi
              echo "Preview access check passed."
              exit 0
            fi

            if [[ "${http_code}" =~ ^30[1278]$ ]]; then
              location=$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/, "", $2); print $2; exit}' preview_headers.txt)

              if [[ -z "${location}" ]]; then
                echo "Received redirect (HTTP ${http_code}) without Location header."
                exit 1
              fi

              if [[ "${location}" == https://vercel.com/* || "${location}" == *"/sso-api"* ]]; then
                echo "Redirected to Vercel authentication: ${location}"
                echo "Bypass token was not accepted for this deployment protection setup."
                exit 1
              fi

              if [[ "${location}" == /* ]]; then
                TARGET_URL="https://$(echo "${TARGET_URL}" | awk -F/ '{print $3}')${location}"
              else
                TARGET_URL="${location}"
              fi

              echo "Following redirect ${hop}/${MAX_HOPS}: ${TARGET_URL}"
              continue
            fi

            echo "Preview returned HTTP ${http_code}."
            echo "Response body preview:"
            sed -n '1,120p' preview.html || true
            exit 1
          done

          echo "Too many redirects while checking preview accessibility."
          exit 1

      - name: Run E2E tests against Vercel Preview
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.PREVIEW_TEST_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
